name: Build Noname APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Decode keystore dari Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/noname.keystore"
          echo "Ukuran keystore: $(wc -c < "$GITHUB_WORKSPACE/noname.keystore") byte"

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ -s noname.keystore ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo ">>> Build RELEASE ter-sign"
            ./gradlew assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/noname.keystore" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            echo ">>> Secrets belum lengkap — build DEBUG (unsigned) sebagai fallback"
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Siapkan nama APK
        run: |
          mkdir -p output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            mv app/build/outputs/apk/release/app-release.apk "output/Noname-v${{ github.run_number }}-signed.apk"
          else
            mv app/build/outputs/apk/debug/app-debug.apk "output/Noname-v${{ github.run_number }}-debug.apk"
          fi
          ls -la output/

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noname-APK
          path: output/*.apk
          if-no-files-found: error
